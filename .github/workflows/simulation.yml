name: VHDL Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      VUNIT_SIMULATOR: ghdl

    steps:
      - name: Get repository sources
        uses: actions/checkout@v6

      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl python3 python3-venv

      - name: Prepare Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Show tool versions
        run: |
          ghdl --version
          .venv/bin/python --version
          .venv/bin/python -m pip show vunit_hdl

      - name: Run existing GHDL regression
        run: .venv/bin/python scripts/run_tests.py

      - name: Run VUnit ALU tests
        run: .venv/bin/python scripts/run_vunit.py